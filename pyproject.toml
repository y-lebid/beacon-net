[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon-net"
version = "1.1.0"
description = "Real-time terminal monitor for outbound process network activity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
    "rich>=13.0.0",
]

[project.scripts]
beacon = "beacon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "jinja2>=3.1.4",
]

[tool.setuptools.package-data]
"beacon.web" = [
    "templates/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "static/img/*",
]